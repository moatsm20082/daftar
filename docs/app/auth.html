<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src https://*.supabase.co; base-uri 'none'; form-action 'none'; object-src 'none'">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<title>دفتر · تسجيل الدخول</title>
<link rel="icon" href="icons/favicon-32.png" type="image/png">
<style>
  :root{--bg:#F3F6FC;--card:#fff;--ink:#0A1330;--sub:#5B6785;--brand:#2D5BFF;--good:#1a9e5f;--bad:#C53B3B;color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--bg:#070C1F;--card:#101936;--ink:#EEF2FF;--sub:#9AA6C7;--brand:#7C9BFF;--good:#4fd18f;--bad:#ff8080;color-scheme:dark}}
  *{box-sizing:border-box}
  body{margin:0;min-height:100dvh;display:grid;place-items:center;background:var(--bg);color:var(--ink);font:16px/1.6 system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;padding:24px max(16px,env(safe-area-inset-right)) 24px max(16px,env(safe-area-inset-left))}
  .card{width:min(380px,100%);background:var(--card);border-radius:22px;padding:28px 22px;text-align:center;box-shadow:0 20px 50px -25px rgba(10,19,48,.35);display:flex;flex-direction:column;gap:12px;align-items:center}
  .ic{width:60px;height:60px;border-radius:50%;display:grid;place-items:center;font-size:28px;font-weight:700}
  .ok .ic{background:color-mix(in srgb,var(--good) 15%,transparent);color:var(--good)}
  .err .ic{background:color-mix(in srgb,var(--bad) 15%,transparent);color:var(--bad)}
  h1{margin:0;font-size:1.25rem}
  p{margin:0;color:var(--sub)}
  .spin{width:34px;height:34px;border-radius:50%;border:3px solid color-mix(in srgb,var(--brand) 25%,transparent);border-top-color:var(--brand);animation:s 1s linear infinite}
  @keyframes s{to{transform:rotate(360deg)}}
  a.btn{display:inline-block;margin-top:6px;padding:12px 22px;border-radius:14px;background:var(--brand);color:#fff;text-decoration:none;font-weight:600}
  [hidden]{display:none!important}
</style>
</head>
<body>
<main class="card" id="box"><div class="spin" aria-hidden="true"></div><p id="msg">لحظة…</p></main>
<script src="config.js"></script>
<script src="auth.js"></script>
</body>
</html>
