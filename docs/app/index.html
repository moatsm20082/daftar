<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; manifest-src 'self'; worker-src 'self'; frame-src 'none'; base-uri 'none'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0029A3">
<meta name="description" content="دفتر: إدارة شغل أي شركة — الفريق، الدوام، الرواتب، المصاريف والأرباح. Daftar: run any business from one place.">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دفتر">
<title>دفتر</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icons/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preload" href="fonts/plex-arabic-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app"></div>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-back" data-act="closeSheet"></div>
  <form class="sheet-panel" id="sheetForm" novalidate>
    <h2 id="sheetTitle"></h2>
    <div id="sheetBody" style="display:flex;flex-direction:column;gap:14px"></div>
    <div class="sheet-actions">
      <button type="submit" class="btn primary" id="sheetSave">حفظ</button>
      <button type="button" class="btn ghost" data-act="closeSheet" id="sheetCancel">إلغاء</button>
      <span id="sheetExtra"></span>
    </div>
  </form>
</div>
<div class="chat" id="chat" hidden></div>
<button class="fab" id="fab" data-act="quick" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
<noscript>JavaScript is required. لازم تشغّل JavaScript.</noscript>
<script src="vendor/supabase.js"></script>
<script src="config.js"></script>
<script src="track.js"></script>
<script src="app.js"></script>
</body>
</html>
