<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<base href="/app/">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'wasm-unsafe-eval'; style-src 'self' 'unsafe-inline'; font-src 'self'; img-src 'self' data: blob: https://*.supabase.co; connect-src 'self' https://*.supabase.co wss://*.supabase.co; manifest-src 'self'; worker-src 'self'; frame-src 'none'; base-uri 'self'; form-action 'none'; object-src 'none'; upgrade-insecure-requests">
<meta name="referrer" content="no-referrer">
<meta name="robots" content="noindex">
<meta name="format-detection" content="telephone=no">
<meta name="theme-color" content="#0029A3">
<meta name="description" content="دفتر: إدارة شغل أي شركة — الفريق، الدوام، الرواتب، المصاريف والأرباح. Daftar: run any business from one place.">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="دفتر">
<title>جرّب دفتر · Try Daftar</title>
<link rel="icon" href="icons/favicon-32.png" type="image/png">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="preload" href="fonts/plex-arabic-400.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="style.css?v=17">
<style>
.demo-bar{position:sticky;top:0;z-index:40;display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:6px 12px;padding:8px max(14px,env(safe-area-inset-right)) 8px max(14px,env(safe-area-inset-left));padding-top:max(8px,env(safe-area-inset-top));background:#D9B26A;color:#2A1E05;font-size:13.5px;font-weight:600;line-height:1.5}
.demo-bar>span:first-child{flex:1 1 180px}.demo-bar__a{display:flex;gap:8px;align-items:center}
.demo-bar button,.demo-bar a{white-space:nowrap;font:inherit;font-size:13px;border-radius:999px;padding:5px 12px;text-decoration:none;cursor:pointer}
.demo-bar button{background:transparent;border:1px solid rgba(42,30,5,.45);color:inherit}
.demo-bar a{background:#0B1433;color:#fff;border:1px solid #0B1433}
.demo-cover{position:fixed;inset:0;z-index:100;display:grid;place-items:center;background:#060B1F;color:#EEF1FF;text-align:center}
.demo-cover b{display:block;font-size:20px;margin-bottom:6px}.demo-cover span{opacity:.7}
</style>
</head>
<body>
<div id="app"></div>
<div class="sheet" id="sheet" hidden>
  <div class="sheet-back" data-act="closeSheet"></div>
  <form class="sheet-panel" id="sheetForm" novalidate>
    <h2 id="sheetTitle"></h2>
    <div id="sheetBody" style="display:flex;flex-direction:column;gap:14px"></div>
    <div class="sheet-actions">
      <button type="submit" class="btn primary" id="sheetSave">حفظ</button>
      <button type="button" class="btn ghost" data-act="closeSheet" id="sheetCancel">إلغاء</button>
      <span id="sheetExtra"></span>
    </div>
  </form>
</div>
<div class="chat" id="chat" hidden></div>
<button class="fab" id="fab" data-act="quick" hidden><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg></button>
<div class="toast" id="toast" hidden role="status" aria-live="polite"></div>
<noscript>JavaScript is required. لازم تشغّل JavaScript.</noscript>
<script src="/demo/demo-sb.js"></script>
<script src="config.js"></script>
<script src="track.js"></script>
<script src="app.js?v=17"></script>
<script src="/demo/demo.js"></script>
</body>
</html>
